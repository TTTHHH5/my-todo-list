<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .app {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      box-shadow: 0 12px 32px rgba(31, 41, 55, 0.12);
      padding: 24px;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 28px;
      line-height: 1.2;
      color: #111827;
    }

    /* Auth Styles */
    .auth-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .user-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e5e7eb;
      font-size: 14px;
    }

    .user-email {
      font-weight: 600;
      color: #374151;
    }

    .logout-button {
      background: none;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
    }

    .logout-button:hover {
      background: #f3f4f6;
    }

    .hidden {
      display: none !important;
    }

    /* Existing Styles */
    .todo-form {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      margin-bottom: 18px;
    }

    .todo-input, .auth-input {
      flex: 1;
      min-width: 0;
      height: 44px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 0 12px;
      font-size: 16px;
      outline: none;
      background: #ffffff;
    }

    .todo-input:focus, .auth-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
    }

    .priority-buttons,
    .item-priority-buttons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .priority-button {
      height: 34px;
      border: 1px solid #cbd5e1;
      border-radius: 999px;
      padding: 0 10px;
      background: #ffffff;
      color: #374151;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .priority-buttons .priority-button {
      height: 44px;
    }

    .priority-button:hover {
      background: #f3f4f6;
    }

    .priority-button.active[data-priority="high"] {
      border-color: #ef4444;
      background: #fee2e2;
      color: #b91c1c;
    }

    .priority-button.active[data-priority="normal"] {
      border-color: #2563eb;
      background: #dbeafe;
      color: #1d4ed8;
    }

    .priority-button.active[data-priority="low"] {
      border-color: #10b981;
      background: #d1fae5;
      color: #047857;
    }

    .add-button, .auth-button, .delete-button {
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      transition: background-color 0.15s ease, transform 0.15s ease;
    }

    .add-button, .auth-button {
      height: 44px;
      padding: 0 18px;
      background: #2563eb;
      color: #ffffff;
      white-space: nowrap;
    }

    .auth-button.secondary {
      background: #64748b;
    }

    .add-button:hover, .auth-button:hover {
      background: #1d4ed8;
    }

    .auth-button.secondary:hover {
      background: #475569;
    }

    .todo-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 10px;
      min-height: 14px;
    }

    .todo-list.drag-over {
      border-radius: 8px;
      background: #eff6ff;
    }

    .todo-item {
      display: grid;
      grid-template-columns: auto auto minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 10px;
      min-height: 46px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 10px;
      background: #ffffff;
    }

    .todo-item.dragging {
      opacity: 0.55;
    }

    .drag-handle {
      color: #9ca3af;
      cursor: grab;
      font-size: 18px;
      line-height: 1;
      user-select: none;
    }

    .todo-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .todo-text {
      flex: 1;
      overflow-wrap: anywhere;
      font-size: 16px;
    }

    .todo-item.completed .todo-text {
      color: #9ca3af;
      text-decoration: line-through;
    }

    .delete-button {
      background: #ef4444;
      color: #ffffff;
      padding: 0 10px;
      height: 34px;
    }

    .empty-message {
      margin-top: 18px;
      text-align: center;
      color: #6b7280;
    }

    .status-message {
      margin-top: 14px;
      text-align: center;
      color: #b45309;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Todo List</h1>

    <!-- Auth Section -->
    <div id="auth-section" class="auth-section">
      <p>로그인하여 할 일을 관리하세요.</p>
      <div class="auth-form">
        <input type="email" id="auth-email" class="auth-input" placeholder="이메일">
        <input type="password" id="auth-password" class="auth-input" placeholder="비밀번호">
        <button id="login-btn" class="auth-button">로그인</button>
        <button id="signup-btn" class="auth-button secondary">회원가입</button>
      </div>
    </div>

    <!-- Todo Section (Hidden initially) -->
    <div id="todo-section" class="hidden">
      <div class="user-info">
        <span id="user-display-email" class="user-email"></span>
        <button id="logout-btn" class="logout-button">로그아웃</button>
      </div>

      <form class="todo-form" id="todo-form">
        <input class="todo-input" id="todo-input" type="text" placeholder="할 일을 입력하세요" autocomplete="off">
        <div class="priority-buttons" id="priority-buttons">
          <button class="priority-button" type="button" data-priority="high">높음</button>
          <button class="priority-button active" type="button" data-priority="normal">보통</button>
          <button class="priority-button" type="button" data-priority="low">낮음</button>
        </div>
        <button class="add-button" type="submit">추가</button>
      </form>

      <ul class="todo-list" id="todo-list"></ul>
      <p class="empty-message" id="empty-message">아직 등록된 할 일이 없습니다.</p>
    </div>

    <p class="status-message" id="status-message"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://xrkisdgbaazkxiupvupr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhya2lzZGdiYWF6a3hpdXB2dXByIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1NjYyNDAsImV4cCI6MjA5NDE0MjI0MH0.samdXnhBRHVqgRBhDfiac7rK3ZwL-eABMk7z-2LWU8I';
    const TODO_TABLE = 'todos';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Elements
    const authSection = document.getElementById('auth-section');
    const todoSection = document.getElementById('todo-section');
    const authEmail = document.getElementById('auth-email');
    const authPassword = document.getElementById('auth-password');
    const loginBtn = document.getElementById('login-btn');
    const signupBtn = document.getElementById('signup-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const userDisplayEmail = document.getElementById('user-display-email');
    
    const todoForm = document.getElementById('todo-form');
    const todoInput = document.getElementById('todo-input');
    const priorityButtons = document.getElementById('priority-buttons');
    const todoList = document.getElementById('todo-list');
    const emptyMessage = document.getElementById('empty-message');
    const statusMessage = document.getElementById('status-message');

    let todos = [];
    let selectedPriority = 'normal';
    let currentUser = null;

    const priorityOrder = { high: 0, normal: 1, low: 2 };
    const priorityLabels = { high: '높음', normal: '보통', low: '낮음' };

    // --- Auth Logic ---

    async function handleSignUp() {
      const email = authEmail.value;
      const password = authPassword.value;
      setStatus('회원가입 중...');
      const { data, error } = await supabaseClient.auth.signUp({ email, password });
      if (error) setStatus(`회원가입 실패: ${error.message}`);
      else setStatus('회원가입 성공! 로그인해 주세요.');
    }

    async function handleLogin() {
      const email = authEmail.value;
      const password = authPassword.value;
      setStatus('로그인 중...');
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) setStatus(`로그인 실패: ${error.message}`);
      else setStatus('');
    }

    async function handleLogout() {
      await supabaseClient.auth.signOut();
    }

    supabaseClient.auth.onAuthStateChange((event, session) => {
      currentUser = session?.user || null;
      updateUI();
      if (currentUser) {
        loadTodos();
      } else {
        todos = [];
        renderTodos();
      }
    });

    function updateUI() {
      if (currentUser) {
        authSection.classList.add('hidden');
        todoSection.classList.remove('hidden');
        userDisplayEmail.textContent = currentUser.email;
      } else {
        authSection.classList.remove('hidden');
        todoSection.classList.add('hidden');
        userDisplayEmail.textContent = '';
      }
    }

    // --- Todo Logic ---

    async function loadTodos() {
      const { data, error } = await supabaseClient
        .from(TODO_TABLE)
        .select('*')
        .order('priority', { ascending: true }) // Basic order
        .order('order_index', { ascending: true });

      if (error) {
        setStatus(`데이터 로드 실패: ${error.message}`);
        return;
      }
      todos = data || [];
      renderTodos();
    }

    function setStatus(message) {
      statusMessage.textContent = message;
    }

    function renderTodos() {
      todoList.innerHTML = '';
      const sortedTodos = getAllSortedTodos();
      emptyMessage.classList.toggle('hidden', sortedTodos.length > 0);
      sortedTodos.forEach(todo => todoList.appendChild(createTodoItem(todo)));
    }

    function getAllSortedTodos() {
      return [...todos].sort((a, b) => {
        const pDiff = priorityOrder[a.priority] - priorityOrder[b.priority];
        return pDiff !== 0 ? pDiff : (a.order_index - b.order_index);
      });
    }

    function createTodoItem(todo) {
      const item = document.createElement('li');
      item.className = `todo-item priority-${todo.priority}`;
      if (todo.completed) item.classList.add('completed');
      
      item.innerHTML = `
        <span class="drag-handle">⋮⋮</span>
        <input type="checkbox" class="todo-checkbox" ${todo.completed ? 'checked' : ''}>
        <span class="todo-text">${todo.text}</span>
        <div class="item-priority-buttons"></div>
        <button class="delete-button">삭제</button>
      `;

      item.querySelector('.todo-checkbox').onclick = () => toggleTodo(todo.id, !todo.completed);
      item.querySelector('.delete-button').onclick = () => deleteTodo(todo.id);
      
      const pButtons = item.querySelector('.item-priority-buttons');
      Object.entries(priorityLabels).forEach(([val, label]) => {
        const btn = document.createElement('button');
        btn.className = `priority-button ${val === todo.priority ? 'active' : ''}`;
        btn.dataset.priority = val;
        btn.textContent = label;
        btn.onclick = () => updatePriority(todo.id, val);
        pButtons.appendChild(btn);
      });

      return item;
    }

    async function addTodo(text, priority) {
      const { data, error } = await supabaseClient
        .from(TODO_TABLE)
        .insert([{ 
          text, 
          priority, 
          order_index: getNextOrder(priority),
          user_id: currentUser.id 
        }])
        .select();

      if (error) setStatus(`추가 실패: ${error.message}`);
      else {
        todos.push(data[0]);
        renderTodos();
        todoInput.value = '';
      }
    }

    function getNextOrder(priority) {
      const samePriority = todos.filter(t => t.priority === priority);
      return samePriority.length === 0 ? 0 : Math.max(...samePriority.map(t => t.order_index)) + 1;
    }

    async function toggleTodo(id, completed) {
      const { error } = await supabaseClient.from(TODO_TABLE).update({ completed }).eq('id', id);
      if (error) setStatus(`상태 변경 실패: ${error.message}`);
      else {
        todos = todos.map(t => t.id === id ? { ...t, completed } : t);
        renderTodos();
      }
    }

    async function deleteTodo(id) {
      const { error } = await supabaseClient.from(TODO_TABLE).delete().eq('id', id);
      if (error) setStatus(`삭제 실패: ${error.message}`);
      else {
        todos = todos.filter(t => t.id !== id);
        renderTodos();
      }
    }

    async function updatePriority(id, priority) {
      const { error } = await supabaseClient.from(TODO_TABLE).update({ priority, order_index: getNextOrder(priority) }).eq('id', id);
      if (error) setStatus(`우선순위 변경 실패: ${error.message}`);
      else {
        todos = todos.map(t => t.id === id ? { ...t, priority } : t);
        renderTodos();
      }
    }

    // Events
    loginBtn.onclick = handleLogin;
    signupBtn.onclick = handleSignUp;
    logoutBtn.onclick = handleLogout;

    todoForm.onsubmit = (e) => {
      e.preventDefault();
      const text = todoInput.value.trim();
      if (text) addTodo(text, selectedPriority);
    };

    priorityButtons.onclick = (e) => {
      const btn = e.target.closest('.priority-button');
      if (!btn) return;
      selectedPriority = btn.dataset.priority;
      priorityButtons.querySelectorAll('.priority-button').forEach(b => b.classList.toggle('active', b === btn));
    };

  </script>
</body>
</html>
</body>
</html>
