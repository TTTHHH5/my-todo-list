services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: tetris-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tetris-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://tetris:tetris@mysql:3306/tetris?charset=utf8mb4
      SECRET_KEY: ${SECRET_KEY:-tetris-dev-secret-key-change-in-production}
      TZ: Asia/Seoul
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: tetris-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tetris
      MYSQL_USER: tetris
      MYSQL_PASSWORD: tetris
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -utetris -ptetris --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
